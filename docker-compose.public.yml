services:
  db:
    ports: !reset []

  db-viewer:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${PUBLIC_JWT_SECRET:?Set PUBLIC_JWT_SECRET before starting the public demo}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:55173}
      COOKIE_SECURE: ${PUBLIC_COOKIE_SECURE:-true}
      TRUSTED_HOSTS: ${PUBLIC_TRUSTED_HOSTS:-localhost,127.0.0.1}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_NAME: ${ADMIN_NAME:-Operator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  frontend:
    ports: !override
      - "127.0.0.1:55173:80"

volumes:
  expense_db:
    name: expense_splitter_public_v2_db
