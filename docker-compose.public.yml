services:
  db:
    ports: !reset []

  db-viewer:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${PUBLIC_JWT_SECRET:?Set PUBLIC_JWT_SECRET before starting the public demo}
      CORS_ORIGINS: https://app.99696699.xyz
      COOKIE_SECURE: "true"
      TRUSTED_HOSTS: "app.99696699.xyz,localhost,127.0.0.1"

  frontend:
    ports: !override
      - "127.0.0.1:55173:80"

volumes:
  expense_db:
    name: expense_splitter_public_v2_db
