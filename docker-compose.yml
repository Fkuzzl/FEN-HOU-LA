services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_splitter
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense_dev_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["expense_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_splitter"]
      interval: 5s
      timeout: 5s
      retries: 12
  db-viewer:
    image: adminer:4
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [db]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://expense:expense_dev_password@db:5432/expense_splitter
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_NAME: ${ADMIN_NAME:-Operator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  expense_db:
